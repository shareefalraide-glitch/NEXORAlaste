name: NEXORA CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  api-and-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXORA_TEST_DATABASE_URL: postgres://nexora:ci-only-not-a-production-secret@localhost:5432/nexora_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Markdown and task issue titles
        run: |
          python scripts/check_markdown.py
          sh scripts/prepare-github-issues.sh
      - name: Validate OpenAPI and route inventory
        run: |
          python -m pip install -r tools/requirements-contracts.txt
          python scripts/check_contracts.py
      - name: Go tests with PostgreSQL 16 and race detector
        working-directory: services/api
        run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal)"
      - name: Real HTTP and contract smoke (disposable CI database)
        env:
          NEXORA_ENV: development
          DATABASE_URL: postgres://nexora:ci-only-not-a-production-secret@localhost:5432/nexora_test?sslmode=disable
          NEXORA_JWT_SECRET: ci-only-not-a-production-jwt-secret-1234567890
          NEXORA_BOOTSTRAP_ORG_SLUG: smoke
          NEXORA_BOOTSTRAP_ORG_NAME: Smoke
          NEXORA_BOOTSTRAP_EMAIL: admin@example.invalid
          NEXORA_BOOTSTRAP_PASSWORD: ci-only-temporary-password-for-tests
          NEXORA_SMOKE_ALLOW_WRITES: '1'
          NEXORA_SMOKE_BASE_URL: http://127.0.0.1:8080
          NEXORA_SMOKE_ORG: smoke
          NEXORA_SMOKE_EMAIL: admin@example.invalid
          NEXORA_SMOKE_PASSWORD: ci-only-temporary-password-for-tests
        run: |
          cd services/api
          go build -o "$RUNNER_TEMP/nexora" ./cmd/nexora
          "$RUNNER_TEMP/nexora" migrate
          "$RUNNER_TEMP/nexora" bootstrap
          "$RUNNER_TEMP/nexora" serve > "$RUNNER_TEMP/nexora.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then echo "API ready on attempt $i"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          cd ../..
          python scripts/contract_smoke.py
  ml-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ml/requirements-dev.lock
      - run: python -m pip install -r services/ml/requirements-dev.lock
      - run: cd services/ml && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:structure && npm run test:unit && npm run lint && npm run format:check && npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:network && npm run test:workspace161
