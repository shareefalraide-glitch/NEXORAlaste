name: Dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: '19 4 * * 1'
permissions:
  contents: read
jobs:
  go-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/api/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Full Go source vulnerability analysis
        working-directory: services/api
        run: govulncheck ./...
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --requirement services/ml/requirements.lock
      - run: pip-audit --requirement services/ml/requirements-dev.lock
